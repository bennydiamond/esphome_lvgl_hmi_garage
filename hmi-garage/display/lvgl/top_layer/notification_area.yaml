obj:
  x: 0
  y: 0
  align: TOP_LEFT
  height: 43
  width: 800
  radius: 0
  bg_opa: TRANSP
  border_width: 0
  pad_all: 0
  widgets:
    - line:
          points:
            - 10, 41
            - 790, 41
          line_width: 2
          line_color: color_dark_gray
          line_rounded: true

    - obj:
        align: TOP_RIGHT
        width: 160
        height: 40
        pad_all: 0
        bg_opa: TRANSP
        border_opa: TRANSP
        pad_right: 1
        layout: # enable the FLEX layout for the children widgets
            type: FLEX
            flex_flow: ROW  # the order of the widgets starts top left
            flex_align_main : END
            pad_column: 3
        widgets:
            # Time display. Must be at the start to avoid shifting when other icons appear/disappear
            # Only shown when not on home page
            - label:
                styles: style_notif_icon
                id: id_lv_lab_time_notif_area
                pad_right: 8
                text_color: color_white
                text_font: lato_30
                hidden: true
            # Home Assistant status
            - label:
                styles: style_notif_icon
                id: id_lv_lab_ha_status
                align: TOP_RIGHT
                text: "${ha}"
                text_color: color_dark_gray
            # Wi-Fi status
            - label:
                styles: style_notif_icon
                id: id_lv_lab_wifi_status
                align: TOP_RIGHT
                text: "${wifi_100}"
                text_color: color_dark_gray


    - obj:
          align: TOP_LEFT
          width: 400
          height: 40
          x: 0
          y: 0
          pad_all: 0
          bg_opa: TRANSP
          border_opa: TRANSP
          pad_left: 1
          layout: # enable the FLEX layout for the children widgets
            type: FLEX
            flex_flow: ROW  # the order of the widgets starts top left
            flex_align_main : START # they sould be centered
            pad_column: 3
          widgets:
            # Front door
            - button:
                id: id_lv_but_front_door
                styles: style_notif_button
                hidden: true
                widgets:
                    - label:
                        styles: style_notif_icon
                        text: "${door_open}"
                        text_color: color_red
                on_short_click:
                    then:
                        - lvgl.widget.show: id_lv_popupbox_front_door
                on_long_press:
                    then:
                        - lvgl.widget.show: id_lv_popupbox_front_door
            # Patio door
            - button:
                id: id_lv_but_patio_door
                styles: style_notif_button
                hidden: true
                widgets:
                    - label:
                        styles: style_notif_icon
                        text: "${patio_door_open}"
                        text_color: color_red
                on_short_click:
                    then:   
                        - lvgl.widget.show: id_lv_popupbox_patio_door
                on_long_press:
                    then:
                        - lvgl.widget.show: id_lv_popupbox_patio_door
            # River Level critical
            - button:
                id: id_lv_but_riv_lvl_crit_notif
                styles: style_notif_button
                hidden: true
                widgets:
                    - label:
                        styles: style_notif_icon
                        text: "${waves_arrow_up}"
                        text_color: color_red
                on_short_click:
                    then:
                        - lvgl.widget.show: id_lv_popupbox_riv_lvl_crit
                on_long_press:
                    then:
                        - lvgl.widget.show: id_lv_popupbox_riv_lvl_crit
            # Attic Light ON
            - button:
                id: id_lv_but_notify_attic_light
                styles: style_notif_button
                hidden: true
                widgets:
                    - label:
                        styles: style_notif_icon
                        text: "${home_floor_g}"
                        text_color: color_warmest_white
                on_short_click:
                    then:
                        - lvgl.widget.show: id_lv_popupbox_attic
                on_long_press:
                    then:
                        - lvgl.widget.show: id_lv_popupbox_attic
            # HVAC status
            - button:
                id: id_lv_but_hvac_status
                styles: style_notif_button
                hidden: true
                widgets:
                  - label:
                      styles: style_notif_icon
                      id: id_lv_lab_hvac_status
                      text: "${heating}"
                      text_color: color_orange
                on_short_click:
                  then:
                    - lvgl.widget.show: id_lv_popupbox_hvac
                on_long_press:
                  then:
                    - lvgl.widget.show: id_lv_popupbox_hvac
            # Miner status
            - button:
                id: id_lv_but_miner_status
                styles: style_notif_button
                hidden: true
                widgets:
                  - label:
                      styles: style_notif_icon
                      id: id_lv_lab_miner_status
                      text: "${heating}"
                      text_color: color_orange
                on_short_click:
                  then:
                    - lvgl.widget.show: id_lv_popupbox_miner
                on_long_press:
                  then:
                    - lvgl.widget.show: id_lv_popupbox_miner
            # Défi Hilo active
            - button:
                id: id_lv_but_defi_hilo
                styles: style_notif_button
                hidden: true
                widgets:
                  - label:
                      styles: style_notif_icon
                      id: id_lv_lab_defi_hilo
                      text: "${h_circle_outline}"
                      text_color: color_yellow
                on_short_click:
                  then:
                    - lvgl.widget.show: id_lv_popupbox_defi_hilo
                on_long_press:
                  then:
                    - lvgl.widget.show: id_lv_popupbox_defi_hilo
            # Outside SoilSensors Global Alert
            - button:
                id: id_lv_but_outside_soil_alert
                styles: style_notif_button
                hidden: true
                widgets:
                    - label:
                        styles: style_notif_icon
                        text: "${watering_can}"
                        text_color: color_green
                on_short_click:
                    then:
                        - lvgl.widget.show: page_watering
                        - lvgl.tabview.select:
                            id: id_lv_tab_watering
                            index : 0
                        - lvgl.page.show: 
                            id: page_watering
                            animation: OUT_RIGHT
                            time: 300ms
                on_long_press:
                    then:
                        - lvgl.widget.show: page_watering
                        - lvgl.tabview.select:
                            id: id_lv_tab_watering
                            index : 0
                        - lvgl.page.show: 
                            id: page_watering
                            animation: OUT_RIGHT
                            time: 300ms
            # Inside SoilSensors Global Alert
            - button:
                id: id_lv_but_inside_soil_alert
                styles: style_notif_button
                hidden: true
                widgets:
                    - label:
                        styles: style_notif_icon
                        text: "${watering_can}"
                        text_color: color_blue
                on_short_click:
                    then:
                        - lvgl.widget.show: page_watering
                        - lvgl.tabview.select:
                            id: id_lv_tab_watering
                            index : 0
                        - lvgl.page.show: 
                            id: page_watering
                            animation: OUT_RIGHT
                            time: 300ms
                on_long_press:
                    then:
                        - lvgl.widget.show: page_watering
                        - lvgl.tabview.select:
                            id: id_lv_tab_watering
                            index : 0
                        - lvgl.page.show: 
                            id: page_watering
                            animation: OUT_RIGHT
                            time: 300ms
            # Water Softener Salt Level critical
            - button:
                id: id_lv_but_salt_lvl
                styles: style_notif_button
                hidden: True
                widgets:
                - label:
                    styles: style_notif_icon
                    text: "${salt_shaker}"
                    text_color: color_yellow
                on_short_click:
                    then:
                        - lvgl.widget.show: id_lv_popupbox_salt
                on_long_press:
                    then:
                        - lvgl.widget.show: id_lv_popupbox_salt
            # Irrigation System Active
            - button:
                id: id_lv_but_watering_active
                styles: style_notif_button
                hidden: true
                widgets:
                    - label:
                        styles: style_notif_icon
                        text: "${sprinkler}"
                        text_color: color_blue
                on_short_click:
                    then:
                        - lvgl.widget.show: page_watering
                        - lvgl.tabview.select:
                            id: id_lv_tab_watering
                            index : 1
                        - lvgl.page.show: 
                            id: page_watering
                            animation: OUT_RIGHT
                            time: 300ms
                on_long_press:
                    then:
                        - lvgl.widget.show: page_watering
                        - lvgl.tabview.select:
                            id: id_lv_tab_watering
                            index : 1
                        - lvgl.page.show: 
                            id: page_watering
                            animation: OUT_RIGHT
                            time: 300ms

            # variable bin day reminder and alert
            - button:
                id: id_lv_but_variable_bin
                styles: style_notif_button
                hidden: True
                widgets:
                - label:
                    styles: style_notif_icon
                    id: id_lv_lab_variable_bin
                    text: "${trash_bin}"
                    text_color: color_red
                on_short_click:
                    then:
                        - if:
                            condition:
                                - binary_sensor.is_on: id_ha_compost_day
                            then:
                                - lvgl.widget.show: id_lv_popupbox_compost
                            else:
                                - if:
                                    condition:
                                        - binary_sensor.is_on: id_ha_recycle_day
                                    then:
                                        - lvgl.widget.show: id_lv_popupbox_recycle
                                    else:
                                        - lvgl.widget.show: id_lv_popupbox_trash
                on_long_press:
                    then:
                        - if:
                            condition:
                                - binary_sensor.is_on: id_ha_compost_day
                            then:
                                - lvgl.widget.show: id_lv_popupbox_compost
                            else:
                                - if:
                                    condition:
                                        - binary_sensor.is_on: id_ha_recycle_day
                                    then:
                                        - lvgl.widget.show: id_lv_popupbox_recycle
                                    else:
                                        - lvgl.widget.show: id_lv_popupbox_trash
            # Water Softener Salt Level critical
            - button:
                id: id_lv_but_catstuff_problem
                styles: style_notif_button
                hidden: True
                widgets:
                - label:
                    styles: style_notif_icon
                    id: id_lv_lab_catstuff_problem
                    text: "${cat}"
                    text_color: color_red
                on_short_click:
                    then:
                        - lvgl.widget.show: id_lv_popupbox_catstuff
                on_long_press:
                    then:
                        - lvgl.widget.show: id_lv_popupbox_catstuff

