obj: # Speaker Volume control
  id: id_lvgl_widget_media_control
  styles: style_transparent_container
  align: TOP_RIGHT
  width: 80
  height: 440
  x: -10
  y: 40
  scrollable: False
  widgets:
      - line:
          align: LEFT_MID
          points:
            - 0, -40
            - 0, 300
          line_width: 2
          line_color: color_dark_gray
          line_rounded: true
      # Speaker Icon
      - button:
          id: id_lvgl_button_volume_speaker
          styles: style_touch_overlay_button
          align: TOP_MID
          on_press:
            - homeassistant.event:
                event: esphome.button_pressed
                data:
                  message: button_mute
      - label:
          id: id_lv_lab_speaker_icon
          align: TOP_MID
          x: 0
          y: 16
          width: 85
          height: 50
          text_font: mdi_icons_48
          text_color: color_white
          text_align: CENTER
          text: ${volume_low}
      
          
      - slider:
          id: id_lv_slid_media_volume
          x: 0
          y: 84
          align: TOP_MID
          width: 18
          height: 260
          min_value: 0
          max_value: 100
          radius: 6
          indicator:
            bg_opa: cover 
          knob:
            radius: 15
            width: 10
            height: 12%
            bg_color: color_blue
          on_value:
            - if:
                condition:
                  binary_sensor.is_off: id_media_muted
                then:
                  - lvgl.label.update:
                      id: id_lv_lab_speaker_icon
                      text: !lambda |-
                        if (x < 25) { return "${volume_low}"; }
                        else if (x < 65) { return "${volume_medium}"; }
                        else { return "${volume_high}"; }
          on_release:
            - homeassistant.action:
                action: number.set_value
                data:
                  entity_id: ${volume_control_garage_entity_id}
                  value: !lambda "return x;"
      - button:
          styles: style_touch_overlay_button
          align: BOTTOM_MID
          on_press:
            - homeassistant.event:
                event: esphome.button_pressed
                data:
                  message: button_play_pause
      - label:
          id: id_lv_lab_music_playpause_icon
          align: BOTTOM_MID
          x: -3
          y: -16
          width: 85
          height: 50
          text_font: mdi_icons_48
          text_color: color_white
          text_align: CENTER
          text: ${play_icon}