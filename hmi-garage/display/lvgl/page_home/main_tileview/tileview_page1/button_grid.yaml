bg_opa: TRANSP
border_opa: TRANSP
layout:
  pad_row: 20
  pad_column: 30
  type: GRID
  grid_columns: [FR(1), FR(1)]
  grid_rows: [FR(1), FR(1), FR(1)]
widgets:
  - button:
      id: id_lv_but_gr_light
      styles: style_home_grid_button
      grid_cell_column_pos: 0
      grid_cell_row_pos: 0
      widgets:
        - label:
            id: id_lv_lab_gr_light
            styles: style_home_grid_icon
            text: "${ceiling_light}"
        - label:
            styles: style_home_grid_label
            text: "Garage"
      on_short_click:
        - homeassistant.action:
            action: light.toggle
            data:
              entity_id: light.${garage_rdc_lights_ha_entity_id}
      on_long_press:
        then:
            - lvgl.widget.show: page_light_garage_rdc
            - lvgl.page.show: 
                id: page_light_garage_rdc
                animation: OUT_RIGHT
                time: 300ms
  - button:
      id: id_lv_but_gs
      styles: style_home_grid_button
      grid_cell_column_pos: 1
      grid_cell_row_pos: 0
      widgets:
        - label:
            id: id_lv_lab_gs
            styles: style_home_grid_icon
            text: "${lights}"
        - label:
            styles: style_home_grid_label
            text: "Sous-Sol\n Garage"
      on_short_click:
        - homeassistant.action:
            action: light.toggle
            data:
              entity_id: light.${garage_ss_lights_ha_entity_id}
      on_long_press:
        then:
            - lvgl.widget.show: page_light_garage_ss
            - lvgl.page.show: 
                id: page_light_garage_ss
                animation: OUT_RIGHT
                time: 300ms

  - button:
      id: id_lv_but_extc
      styles: style_home_grid_button
      grid_cell_column_pos: 0
      grid_cell_row_pos: 1
      widgets:
        - label:
            id: id_lv_lab_extc
            styles: style_home_grid_icon
            text: "${light_recessed}"
        - label:
            styles: style_home_grid_label
            text: "Corniche\n    Coté"
      on_short_click:
        - homeassistant.action:
            action: light.toggle
            data:
              entity_id: light.${exterieur_cote_lights_ha_entity_id}
              color_temp_kelvin: "${default_min_kelvin}"
              brightness_pct: "65"
      on_long_press:
        then:
            - lvgl.widget.show: page_light_exterieur_cote
            - lvgl.page.show: 
                id: page_light_exterieur_cote
                animation: OUT_RIGHT
                time: 300ms

  - button:
      id: id_lv_but_extg
      styles: style_home_grid_button
      grid_cell_column_pos: 1
      grid_cell_row_pos: 1
      widgets:
        - label:
            id: id_lv_lab_extg
            styles: style_home_grid_icon
            text: "${light_recessed}"
        - label:
            styles: style_home_grid_label
            text: "Corniche\n  Garage"
      on_short_click:
        - homeassistant.action:
            action: light.toggle
            data:
              entity_id: light.${exterieur_garage_lights_ha_entity_id}
              color_temp_kelvin: "${default_min_kelvin}"
              brightness_pct: "65"
      on_long_press:
        then:
            - lvgl.widget.show: page_light_exterieur_garage
            - lvgl.page.show: 
                id: page_light_exterieur_garage
                animation: OUT_RIGHT
                time: 300ms

  - button:
      id: id_lv_but_lamp
      styles: style_home_grid_button
      grid_cell_column_pos: 0
      grid_cell_row_pos: 2
      widgets:
        - label:
            id: id_lv_lab_lamp
            styles: style_home_grid_icon
            text: "${lamp_post}"
        - label:
            styles: style_home_grid_label
            text: "Lampadaire\n    Avant"
      on_short_click:
        - homeassistant.action:
            action: light.toggle
            data:
              entity_id: light.${lampadaire_avant_lights_ha_entity_id}
              color_temp_kelvin: "${default_min_kelvin}"
              brightness_pct: "65"
      on_long_press:
        then:
            - lvgl.widget.show: page_lamp
            - lvgl.page.show: 
                id: page_lamp
                animation: OUT_RIGHT
                time: 300ms

  - button:
      styles: style_home_grid_button
      shadow_color: color_mint
      shadow_width: 25
      grid_cell_column_pos: 1
      grid_cell_row_pos: 2
      widgets:
        - label:
            styles: style_home_grid_icon
            text_color: color_mint
            text: "${music_note}"
        - label:
            styles: style_home_grid_label
            text_color: color_mint
            text: " Musique\n  Garage"
      on_short_click:
        then:
            - lvgl.widget.show: page_music
            - lvgl.page.show: 
                id: page_music
                animation: OUT_RIGHT
                time: 300ms
      on_long_press:
        then:
            - lvgl.widget.show: page_music
            - lvgl.page.show: 
                id: page_music
                animation: OUT_RIGHT
                time: 300ms
