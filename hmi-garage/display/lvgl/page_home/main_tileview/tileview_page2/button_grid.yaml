  - button:
      id: id_lv_but_water
      styles: style_home_grid_button
      shadow_color: color_blue
      grid_cell_column_pos: 0
      grid_cell_row_pos: 1
      widgets:
        - label:
            id: id_lv_lab_water_but_ico
            styles: style_home_grid_icon
            text_color: color_blue
            text: "${sprinkler}"
        - label:
            styles: style_home_grid_label
            text: "Arrosage"
      on_short_click:
        then:
            - lvgl.widget.show: page_watering
            - lvgl.page.show: 
                id: page_watering
                animation: OUT_RIGHT
                time: 300ms
      on_long_press:
        then:
            - lvgl.widget.show: page_watering
            - lvgl.page.show: 
                id: page_watering
                animation: OUT_RIGHT
                time: 300ms

  - button:
      id: id_lv_but_car_key
      styles: style_home_grid_button
      shadow_color: color_yellow
      grid_cell_column_pos: 1
      grid_cell_row_pos: 1
      widgets:
        - label:
            styles: style_home_grid_icon
            text_color: color_yellow
            text: "${car_key}"
        - label:
            styles: style_home_grid_label
            text: "Yaris"
      on_short_click:
        - homeassistant.event:
            event: esphome.button_pressed
            data:
              message: button_lock_door_yaris
      on_long_press:
        then:
            - lvgl.widget.show: page_car_lock_yaris
            - lvgl.page.show: 
                id: page_car_lock_yaris
                animation: OUT_RIGHT
                time: 300ms

  - button:
      id: id_lv_but_players_volums
      styles: style_home_grid_button
      shadow_color: color_white
      grid_cell_column_pos: 0
      grid_cell_row_pos: 2
      widgets:
        - label:
            id: id_lv_lab_vol_but_ico
            styles: style_home_grid_icon
            text_color: color_white
            text: "${speaker_wireless}"
        - label:
            styles: style_home_grid_label
            text: "Volumes"
      on_short_click:
        then:
            - lvgl.widget.show: page_players_volume
            - lvgl.page.show: 
                id: page_players_volume
                animation: OUT_RIGHT
                time: 300ms
      on_long_press:
        then:
            - lvgl.widget.show: page_players_volume
            - lvgl.page.show: 
                id: page_players_volume
                animation: OUT_RIGHT
                time: 300ms

  - button:
      styles: style_home_grid_button
      shadow_width: 25
      grid_cell_column_pos: 1
      grid_cell_row_pos: 2
      widgets:
        - label:
            styles: style_home_grid_icon
            text: "${settings}"
        - label:
            styles: style_home_grid_label
            text_color: color_gray
            text: "Settings"
      on_short_click:
        then:
            - lvgl.widget.show: page_settings
            - lvgl.page.show: 
                id: page_settings
                animation: OUT_RIGHT
                time: 300ms
      on_long_press:
        then:
            - lvgl.widget.show: page_settings
            - lvgl.page.show: 
                id: page_settings
                animation: OUT_RIGHT
                time: 300ms
