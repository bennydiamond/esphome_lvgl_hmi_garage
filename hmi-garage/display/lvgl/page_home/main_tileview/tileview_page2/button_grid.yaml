bg_opa: TRANSP
border_opa: TRANSP
layout:
  pad_row: 20
  pad_column: 30
  type: GRID
  grid_columns: [FR(1), FR(1)]
  grid_rows: [FR(1), FR(1), FR(1)]
widgets:
  - button:
      id: id_lv_but_attic_light
      styles: style_home_grid_button
      grid_cell_column_pos: 0
      grid_cell_row_pos: 0
      widgets:
        - label:
            id: id_lv_lab_attic_light
            styles: style_home_grid_icon
            text: "${home_floor_g}"
        - label:
            styles: style_home_grid_label
            text: "Grenier"
      on_short_click:
        - homeassistant.action:
            action: light.toggle
            data:
              entity_id: light.${grenier_light_ha_entity_id}
      on_long_press:
        - homeassistant.action:
            action: light.toggle
            data:
              entity_id: light.${grenier_light_ha_entity_id}
  - button:
      id: id_lv_but_lock_fr
      styles: style_home_grid_button
      shadow_color: color_red
      grid_cell_column_pos: 1
      grid_cell_row_pos: 0
      widgets:
        - label:
            id: id_lv_lab_ico_lock_fr
            styles: style_home_grid_icon
            text_color: color_red
            text: "${unlocked}"
        - label:
            id: id_lv_lab_lock_fr
            styles: style_home_grid_label
            text_color: color_red
            text: "Porte Avant"
      on_short_click:
        - homeassistant.event:
            event: esphome.button_pressed
            data:
              message: button_lock_front_door_toggle
      on_long_press:
        - homeassistant.event:
            event: esphome.button_pressed
            data:
              message: button_lock_front_door_toggle
