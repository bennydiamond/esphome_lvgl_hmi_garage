# lvgl/templates/template.msg_popup.yaml
- obj:
    id: ${widget_id}
    styles: style_popup_overlay
    clickable: true
    hidden: true 

    widgets:
      - obj:
          id: ${widget_id}_window
          styles: style_popup_window
          layout:
            type: flex
            flex_flow: column

          widgets:
            # --- SHARP BOLD TITLE BAR (44px) ---
            - obj:
                styles: style_popup_title_bar
                widgets:
                  - label:
                      text: "${title_text}"
                      text_font: ${title_font}
                      text_color: color_white
                      align: LEFT_MID   
                      x: 15
                  - button:
                      styles: style_popup_close_button
                      widgets:
                        - label:
                            text: "X"
                            align: CENTER
                            text_color: color_white
                      on_click:
                        then:
                          - lvgl.widget.hide: ${widget_id}

            # --- BODY TEXT AREA ---
            - obj:
                styles: style_popup_body_container
                flex_grow: 1
                scrollable: true
                widgets:
                  - label:
                      id: ${body_text_id}
                      text: "${body_text}"
                      text_font: ${body_font}
                      text_color: color_black
                      width: 100%
                      long_mode: wrap

            # --- UNIFIED FOOTER AREA ---
            - obj:
                styles: style_popup_footer_container
                layout:
                  type: flex
                  flex_flow: row
                  flex_align_main: center     
                  flex_align_cross: center    
                  pad_column: 12
                widgets:
                  # Button 1 (Action Button or Main OK)
                  - button:
                      styles: style_popup_btn
                      bg_color: color_blue
                      widgets:
                        - label:
                            text: "${button1_text}"
                            text_font: ${button1_font}
                            text_color: color_black
                            align: CENTER
                      on_click:
                        then:
                          - ${button1_action}: ${button1_target}

                  # Button 2 (Secondary Action - e.g., Close/Cancel)
                  - button:
                      styles: style_popup_btn
                      bg_color: color_gray
                      hidden: ${button2_hidden}
                      widgets:
                        - label:
                            text: "${button2_text}"
                            text_font: ${button2_font}
                            text_color: color_white
                            align: CENTER
                      on_click:
                        then:
                          - ${button2_action}: ${button2_target}