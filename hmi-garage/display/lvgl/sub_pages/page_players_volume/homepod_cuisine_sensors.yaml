binary_sensor:
  - platform: homeassistant
    id: id_bin_cuisine_muted
    internal: True
    entity_id: ${cuisine_mute_state_entity_id}
    trigger_on_initial_state: True
    on_state: 
      then:
        - lvgl.label.update:
            id: id_cuisine_speaker_icon
            text: !lambda |-
              if (x == true) {
                return "${volume_off}";
              }
              float vol = 0;
              if (id(id_lv_slid_cuisine_vol) != nullptr) {
                vol = lv_slider_get_value(id(id_lv_slid_cuisine_vol));
              }
              if (vol <= 0 && id(id_sens_cuisine_volume).has_state()) {
                vol = id(id_sens_cuisine_volume).state;
              }
              if (vol < 25) { return "${volume_low}"; }
              else if (vol < 65) { return "${volume_medium}"; }
              else { return "${volume_high}"; }

sensor:
  - platform: homeassistant
    id: id_sens_cuisine_volume
    entity_id: ${cuisine_volume_control_entity_id}
    internal: true
    on_value:
      - lvgl.slider.update:
          id: id_lv_slid_cuisine_vol
          value: !lambda "return x;"
      - if:
          condition:
            binary_sensor.is_off: id_bin_cuisine_muted
          then:
            - lvgl.label.update:
                id: id_cuisine_speaker_icon
                text: !lambda |-
                  if (x < 25) { return "${volume_low}"; }
                  else if (x < 65) { return "${volume_medium}"; }
                  else { return "${volume_high}"; }
          
text_sensor:
  - platform: homeassistant
    id: id_cuisine_media_state
    entity_id: ${cuisine_media_player_entity_id}
    filters:
      - to_lower:
    internal: true
    on_value:
      - if:
          condition:
            text_sensor.state:
              id: id_cuisine_media_state
              state: 'playing'
          then:
            - lvgl.label.update:
                id: id_cuisine_play_pause_icon
                text: ${pause_icon}
          else:
            - lvgl.label.update:
                id: id_cuisine_play_pause_icon
                text: ${play_icon}