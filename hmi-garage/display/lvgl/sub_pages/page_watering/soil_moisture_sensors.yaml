text_sensor:
  - platform: homeassistant
    id: id_txt_wh51_0d48ec_pretty_name
    entity_id: input_text.soilsensor_wh51_0d48ec_pretty_name
    internal: true
    on_value:
      then:
        - lvgl.label.update:
            id: id_lv_label_title_wh51_0d48ec
            text: !lambda |-
              return id(id_txt_wh51_0d48ec_pretty_name).state.c_str();
