script:
  - id: id_script_backlight_timeout
    mode: restart
    then:
      - if:
          condition:
            not:
              - script.is_running: id_script_blink_quit_icon
          then:
            - if:
                condition: lvgl.is_paused
                then:
                  - logger.log: "LVGL resuming"
                  - lvgl.resume:
                  - lvgl.widget.redraw:
            - light.turn_on: 
                id: id_light_backlight_brightness
                brightness: !lambda return id(id_num_awake_backlight_brightness).state / 100.0;
                transition_length: 300ms
                color_mode: BRIGHTNESS
            - binary_sensor.template.publish:
                id: id_bin_bl_state
                state: True
            - delay: !lambda "return id(id_num_bl_timeout).state * 1000;"
            - light.turn_on:
                id: id_light_backlight_brightness
                brightness: !lambda return id(id_num_idle_backlight_brightness).state / 100.0;
                transition_length: 1500ms
                color_mode: BRIGHTNESS
            - binary_sensor.template.publish:
                id: id_bin_bl_state
                state: False
            - if:
                condition:
                  - not:
                      - lvgl.page.is_showing: page_music
                then:
                  - lvgl.tileview.select:
                      id: id_lv_tile_main
                      tile_id: id_lv_tile_page0
                      animated: true
                  - lvgl.page.show: page_home
                  - lvgl.tabview.select:
                      id: id_lv_tab_watering
                      index: 0
            - delay: 100ms
            - lvgl.pause: